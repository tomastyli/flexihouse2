<!doctype html><meta charset="utf-8"><title>kk</title>
<body style="margin:0"><div id="o" style="font:12px/1.5 monospace;white-space:pre;padding:8px"></div>
<script>
const W=[360,390,414,480,600,768,860,900,1024,1200,1366,1440,1600,1920];
const out=[];let i=0;
function next(){
 if(i>=W.length){document.getElementById('o').textContent=out.join('\n');return;}
 const w=W[i++];
 const f=document.createElement('iframe');
 f.style.cssText='width:'+w+'px;height:900px;border:0;position:absolute;left:-99999px';
 f.src='/_navrh-C.html';
 f.onload=()=>{
   const d=f.contentDocument,cw=f.contentWindow;
   const de=d.documentElement;
   const stage=d.querySelector('.kl-stage');
   const param=d.querySelector('.kl-param');
   const img=d.querySelector('.kl-stage img');
   const kw=d.querySelector('.kl-kota--w');
   const r1=img.getBoundingClientRect(), r2=param.getBoundingClientRect(), r3=kw.getBoundingClientRect();
   const h1=d.querySelector('h1');
   out.push(w+'  scrollW='+de.scrollWidth+(de.scrollWidth>w?' PRETEKA':'')
     +'  vyrezBottom='+r1.bottom.toFixed(0)+' paramTop='+r2.top.toFixed(0)
     +(r1.bottom>r2.top?'  KOLIZE '+(r1.bottom-r2.top).toFixed(0)+'px':'')
     +'  kotaW='+r3.left.toFixed(0)+'-'+r3.right.toFixed(0)+' img='+r1.left.toFixed(0)+'-'+r1.right.toFixed(0)
     +'  h1font='+cw.getComputedStyle(h1).fontSize);
   f.remove();next();
 };
 document.body.appendChild(f);
}
next();
</script>
