<!DOCTYPE html><html><head><meta charset="utf-8"><title>mC7</title></head><body>
<pre id="out" style="font:12px/1.5 monospace">cekam</pre>
<script>
(async()=>{
  const r=[];
  for(const w of [320,360,390,414,640,768,861,900,1100,1280,1440]){
    const f=document.createElement('iframe');
    f.style.cssText='position:absolute;left:-99999px;top:0;border:0;width:'+w+'px;height:900px';
    f.src='/_navrh-C.html';
    document.body.appendChild(f);
    await new Promise(x=>{f.onload=x});
    await new Promise(x=>setTimeout(x,500));
    const d=f.contentDocument, de=d.documentElement;
    for(let y=0;y<de.scrollHeight;y+=600){f.contentWindow.scrollTo(0,y);await new Promise(x=>setTimeout(x,40));}
    f.contentWindow.scrollTo(0,0);
    await new Promise(x=>setTimeout(x,500));

    const preteka = de.scrollWidth - de.clientWidth;
    let vinici=[];
    d.querySelectorAll('body *').forEach(el=>{
      const b=el.getBoundingClientRect();
      if(b.width===0&&b.height===0) return;
      if(b.right > de.clientWidth+1 || b.left < -1){
        vinici.push((el.tagName+'.'+(typeof el.className==='string'?el.className:'')).slice(0,44)+' L'+Math.round(b.left)+' R'+Math.round(b.right));
      }
    });

    let male=[];
    d.querySelectorAll('main a, main button, header a, header button').forEach(el=>{
      const b=el.getBoundingClientRect();
      if(b.height>0&&b.height<48) male.push(((el.className||el.tagName)+'').trim().slice(0,26)+':'+Math.round(b.height)+'x'+Math.round(b.width));
    });

    let img=[];
    d.querySelectorAll('img').forEach(el=>{
      if(!el.complete||el.naturalWidth===0) img.push('BROKEN '+el.getAttribute('src'));
    });

    function bx(sel){const e=d.querySelector(sel);return e?e.getBoundingClientRect():null}
    const stage=bx('.kl-stage'), sImg=bx('.kl-stage img'), kw=bx('.kl-kota--w');
    const kwS=bx('.kl-kota--w span'), khS=bx('.kl-kota--h span');
    const pole=bx('.kl-vykres__pole'), param=bx('.kl-param');
    const bandV=bx('.kl-band__vyrez img'), bandTxt=bx('.kl-band p'), bandKo=bx('.kl-kota--b span');
    const cenaRam=bx('.kl-cena__ram');

    r.push('=== '+w+'px ==='
      +'\n  preteka o '+preteka+'px'+(vinici.length?'\n   vinici: '+vinici.slice(0,10).join(' | '):'')
      +'\n  male cile(<48): '+(male.join(', ')||'zadne')
      +'\n  obrazky: '+(img.join(' | ')||'vse OK')
      +'\n  stage w='+(stage?Math.round(stage.width):'-')+'  img w='+(sImg?Math.round(sImg.width):'-')
      +'\n  kotaW span L'+(kwS?Math.round(kwS.left):'-')+' R'+(kwS?Math.round(kwS.right):'-')+' w='+(kwS?Math.round(kwS.width):'-')+' | linka w='+(kw?Math.round(kw.width):'-')
      +'\n  kotaH span L'+(khS?Math.round(khS.left):'-')+' R'+(khS?Math.round(khS.right):'-')+' bottom='+(khS?Math.round(khS.bottom):'-')+' | pole bottom='+(pole?Math.round(pole.bottom):'-')+' | stage bottom='+(stage?Math.round(stage.bottom):'-')
      +'\n  vyrez pod polem o '+(sImg&&pole?Math.round(sImg.bottom-pole.bottom):'-')+'px | mezera k param='+(param&&sImg?Math.round(param.top-sImg.bottom):'-')
      +'\n  band vyrez w='+(bandV?Math.round(bandV.width):'-')+' L='+(bandV?Math.round(bandV.left):'-')+' | text R='+(bandTxt?Math.round(bandTxt.right):'-')+' | kotaB span top='+(bandKo?Math.round(bandKo.top):'-')+' vyrez bottom='+(bandV?Math.round(bandV.bottom):'-')
      +'\n  cena ram w='+(cenaRam?Math.round(cenaRam.width):'-')
    );
    f.remove();
  }
  document.getElementById('out').textContent=r.join('\n');
})();
</script></body></html>
