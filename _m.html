<!doctype html><meta charset="utf-8"><title>m</title>
<style>html,body{margin:0}#f{width:390px;height:844px;border:0;display:block}</style>
<iframe id="f"></iframe><pre id="out">running</pre>
<script>
const q=new URLSearchParams(location.search);
const f=document.getElementById('f'); f.src=q.get('p');
f.onload=()=>setTimeout(()=>{
 const d=f.contentDocument,w=f.contentWindow;
 const H=d.documentElement.scrollHeight;
 for(let y=0;y<H;y+=500)w.scrollTo(0,y); w.scrollTo(0,0);
 const o=[];
 o.push('viewport='+w.innerWidth+' docScrollW='+d.documentElement.scrollWidth+' H='+H);
 o.push('bodyOverflowX='+getComputedStyle(d.body).overflowX+' htmlOverflowX='+getComputedStyle(d.documentElement).overflowX);
 d.querySelectorAll(q.get('s')||'.pr-kota span').forEach(el=>{
   const r=el.getBoundingClientRect();
   o.push(JSON.stringify({t:el.textContent.trim().slice(0,40),l:Math.round(r.left),r:Math.round(r.right),w:Math.round(r.width),h:Math.round(r.height)}));
 });
 document.getElementById('out').textContent=o.join('\n');
},1500);
</script>
