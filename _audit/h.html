<!doctype html><meta charset=utf-8>
<style>html,body{margin:0}#f{border:0;display:block}</style>
<iframe id=f></iframe><pre id=out>PENDING</pre>
<script>
const P = new URLSearchParams(location.search);
const page = P.get('p'), W = +P.get('w'), H = +(P.get('h')||900);
const f = document.getElementById('f');
f.style.width = W+'px'; f.style.height = H+'px';
f.src = '/'+page;
function run(){
  const d = f.contentDocument, w = f.contentWindow;
  const de = d.documentElement, b = d.body;
  const res = {page, W,
    scrollW: de.scrollWidth, clientW: de.clientWidth,
    bodyScrollW: b.scrollWidth, innerW: w.innerWidth};
  // offenders
  const off = [];
  if (de.scrollWidth > de.clientWidth){
    const lim = de.clientWidth;
    d.querySelectorAll('*').forEach(el=>{
      const r = el.getBoundingClientRect();
      if (r.width===0&&r.height===0) return;
      if (r.right > lim+1){
        off.push({t:el.tagName, c:(el.className&&el.className.baseVal!==undefined?el.className.baseVal:el.className)||'', right:Math.round(r.right), w:Math.round(r.width), txt:(el.textContent||'').trim().slice(0,40)});
      }
    });
  }
  res.off = off.slice(0,25);
  // images
  res.imgs = [...d.images].map(im=>{
    const r = im.getBoundingClientRect();
    return {src: im.currentSrc.split('/').slice(-1)[0], base: im.getAttribute('src'),
      cssW: +r.width.toFixed(1), cssH:+r.height.toFixed(1),
      natW: im.naturalWidth, natH: im.naturalHeight,
      complete: im.complete, hasAlt: im.hasAttribute('alt'), alt: im.getAttribute('alt'),
      aw: im.getAttribute('width'), ah: im.getAttribute('height'),
      srcset: im.getAttribute('srcset'), sizes: im.getAttribute('sizes'),
      loading: im.getAttribute('loading')};
  });
  // touch targets
  const tt = [];
  d.querySelectorAll('a[href],button,input,select,textarea,summary').forEach(el=>{
    const r = el.getBoundingClientRect();
    if (r.width===0&&r.height===0) return;
    const cs = w.getComputedStyle(el);
    if (cs.visibility==='hidden'||cs.display==='none') return;
    tt.push({t:el.tagName, c:(typeof el.className==='string'?el.className:'')||'', h:+r.height.toFixed(1), wd:+r.width.toFixed(1), txt:(el.textContent||el.getAttribute('aria-label')||'').trim().slice(0,32)});
  });
  res.tt = tt;
  // headings
  res.heads = [...d.querySelectorAll('h1,h2,h3,h4,h5,h6')].map(h=>{
    const cs=w.getComputedStyle(h);
    return {l:h.tagName, txt:h.textContent.trim().replace(/\s+/g,' ').slice(0,46), disp:cs.display, clip:cs.clipPath};
  });
  // links
  res.links = [...d.querySelectorAll('a')].map(a=>a.getAttribute('href'));
  document.getElementById('out').textContent = JSON.stringify(res);
}
f.addEventListener('load', ()=>{ setTimeout(run, 1200); });
</script>
