<!doctype html><meta charset="utf-8"><title>m</title>
<body style="margin:0;background:#fff">
<div id="out" style="font:13px/1.5 monospace;white-space:pre;padding:8px"></div>
<iframe id="f" src="/_navrh-C.html" style="width:360px;height:800px;border:0"></iframe>
<script>
const f=document.getElementById('f');
f.onload=()=>{
  const d=f.contentDocument, w=f.contentWindow;
  const lines=[];
  const de=d.documentElement;
  lines.push('viewport '+w.innerWidth+' scrollW '+de.scrollWidth+' bodyScrollW '+d.body.scrollWidth);
  const bad=[];
  d.querySelectorAll('*').forEach(el=>{
    const r=el.getBoundingClientRect();
    if(r.width===0&&r.height===0) return;
    if(r.right>w.innerWidth+1||r.left<-1){
      bad.push((el.tagName+'.'+(el.className&&el.className.baseVal===undefined?String(el.className):'')).slice(0,60)+'  L'+r.left.toFixed(1)+' R'+r.right.toFixed(1)+' W'+r.width.toFixed(1));
    }
  });
  lines.push('PRETEKA ('+bad.length+'):');
  lines.push(bad.slice(0,25).join('\n'));
  document.getElementById('out').textContent=lines.join('\n');
};
</script>
