<!doctype html><html lang="cs"><head><meta charset="utf-8"><title>Chůze</title>
<style>body{margin:0;background:#fff}.s{position:relative;width:1200px;height:840px}canvas{position:absolute;inset:0;width:100%;height:100%}</style>
</head><body>
<div class="s"><canvas id="c" data-vyska="ramec"></canvas></div>
<script>window.requestAnimationFrame=function(cb){return setTimeout(function(){cb(performance.now());},16);};</script>
<script>document.write('<scr'+'ipt src="../../../assets/flexi-3d.js?v='+Date.now()+'"><\/scr'+'ipt>');</script>
<script>
var q=new URLSearchParams(location.search);
var V=Flexi3D.vytvor(document.getElementById('c'),{pomer:0.70,zaklad:'../../../'});
V.nastav({roof:'gable',terrace:true,pohled:'dovnitr',misto:parseInt(q.get('m')||'2',10)});
function klik(px,py){var c=document.getElementById('c'),r=c.getBoundingClientRect();
 ['pointerdown','pointermove','pointerup'].forEach(function(t){
  c.dispatchEvent(new PointerEvent(t,{clientX:r.left+px,clientY:r.top+py,bubbles:true,pointerId:1}));});}
var n=parseInt(q.get('n')||'0',10), i=0;
function dalsi(){ if(i>=n) return; i++; klik(600,700); setTimeout(dalsi,1000); }
setTimeout(dalsi,2000);
</script></body></html>
