<!DOCTYPE html><html><head><meta charset="utf-8"><title>ram</title>
<style>html,body{margin:0;padding:0;background:#888}iframe{border:0;display:block;width:360px}</style></head>
<body><iframe id="f" src="/_navrh-D.html" height="4000"></iframe>
<script>
const f=document.getElementById('f');
f.onload=()=>{
  let n=0;
  const tick=()=>{
    const h=f.contentDocument.documentElement.scrollHeight;
    f.height=h; document.title='h='+h;
    if(n++<40) setTimeout(tick,150);
  };
  tick();
};
</script></body></html>
