<!doctype html><meta charset="utf-8"><title>shot</title>
<style>html,body{margin:0;background:#fff}#f{width:390px;border:0;display:block;height:844px}</style>
<iframe id="f" scrolling="no"></iframe>
<script>
const q=new URLSearchParams(location.search);
const f=document.getElementById('f');
f.src=q.get('p');
f.onload=()=>{setTimeout(()=>{
  const d=f.contentDocument,w=f.contentWindow;
  let H=d.documentElement.scrollHeight;
  for(let y=0;y<H;y+=500)w.scrollTo(0,y);
  w.scrollTo(0,0);
  f.style.height=d.documentElement.scrollHeight+'px';
},1500);};
</script>
