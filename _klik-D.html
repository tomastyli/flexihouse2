<!DOCTYPE html><html><head><meta charset="utf-8"><title>k2</title></head><body><pre id="o">…</pre>
<script>
(async()=>{const r=[];
for(const w of [1024,1200,1280]){
 const f=document.createElement('iframe');
 f.style.cssText='position:absolute;left:0;top:0;border:0;width:'+w+'px;height:1200px';
 f.src='/_navrh-D.html'; document.body.appendChild(f);
 await new Promise(x=>f.onload=x); await new Promise(x=>setTimeout(x,900));
 const d=f.contentDocument;
 const btn=d.querySelector('.pd-go .btn'), b=btn.getBoundingClientRect();
 const n=d.querySelector('.pd-hero .pd-nalepka'), nb=n.getBoundingClientRect();
 const pts=[[b.right-1,b.top+b.height/2],[b.right-1,b.top+2],[b.right-3,b.bottom-2],[b.left+40,b.top+b.height/2]];
 const hits=pts.map(p=>{const e=d.elementFromPoint(p[0],p[1]);return Math.round(p[0])+','+Math.round(p[1])+'->'+(e?e.tagName+'.'+(e.className||''):'null')});
 r.push(w+' | btn '+Math.round(b.left)+'-'+Math.round(b.right)+' | vyrez '+Math.round(nb.left)+'-'+Math.round(nb.right)+' | pointerEvents='+getComputedStyle(n).pointerEvents+'\n   '+hits.join('\n   '));
 f.remove();}
document.getElementById('o').textContent=r.join('\n');})();
</script></body></html>
