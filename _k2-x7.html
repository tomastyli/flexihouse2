<!DOCTYPE html><html><head><meta charset="utf-8"><title>k2</title></head><body>
<pre id="out">start</pre>
<script>
const O=document.getElementById('out');
function log(s){O.textContent+='\n'+s}
function lum(r,g,b){const f=v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)};return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b)}
async function mer(w){
  log('--- '+w+'px start');
  const f=document.createElement('iframe');
  f.style.cssText='position:fixed;left:0;top:0;z-index:9;border:0;width:'+w+'px;height:900px;opacity:.02';
  f.src='/_navrh-C.html';
  document.body.appendChild(f);
  await new Promise(x=>{f.onload=x;setTimeout(x,5000)});
  const d=f.contentDocument;
  const band=d.querySelector('.kl-band');
  const img=d.querySelector('.kl-band__foto');
  img.setAttribute('loading','eager');
  img.src=img.src;
  await new Promise(x=>{if(img.complete&&img.naturalWidth)return x();img.onload=x;img.onerror=x;setTimeout(x,6000)});
  log('  img complete='+img.complete+' nw='+img.naturalWidth);
  if(!img.naturalWidth){f.remove();return}
  const bandR=band.getBoundingClientRect();
  const BW=Math.round(bandR.width),BH=Math.round(bandR.height);
  const nw=img.naturalWidth,nh=img.naturalHeight;
  const sc=Math.max(BW/nw,BH/nh),dw=nw*sc,dh=nh*sc,ox=(BW-dw)/2,oy=(BH-dh)/2;
  const c=document.createElement('canvas');c.width=BW;c.height=BH;
  const ctx=c.getContext('2d');ctx.drawImage(img,ox,oy,dw,dh);
  let data;
  try{data=ctx.getImageData(0,0,BW,BH).data}catch(e){log('  getImageData ERR '+e.message);f.remove();return}
  const A=96*Math.PI/180,sx=Math.sin(A),cy=Math.cos(A);
  const L=Math.abs(BW*sx)+Math.abs(BH*cy);
  const x0=BW/2-(L/2)*sx,y0=BH/2+(L/2)*cy;
  const tAt=(x,y)=>((x-x0)*sx+(y-y0)*(-cy))/L;
  const aAt=t=>t<=0.38?0.93:(t>=1?0.5:(t<=0.62?0.93+(0.74-0.93)*(t-0.38)/0.24:0.74+(0.5-0.74)*(t-0.62)/0.38));
  log('  band '+BW+'x'+BH);
  [['.kl-band h2','h2'],['.kl-band p','p'],['.kl-kota--b span','kota']].forEach(([sel,lab])=>{
    const el=d.querySelector(sel); if(!el){log('  '+lab+' chybi');return}
    const r=el.getBoundingClientRect();
    const X0=Math.max(0,Math.round(r.left-bandR.left)),X1=Math.min(BW,Math.round(r.right-bandR.left));
    const Y0=Math.max(0,Math.round(r.top-bandR.top)),Y1=Math.min(BH,Math.round(r.bottom-bandR.top));
    let worst=99,at=null;
    for(let px=X0;px<X1;px+=2)for(let py=Y0;py<Y1;py+=2){
      const i=(py*BW+px)*4,a=aAt(tAt(px,py));
      const R=a*22+(1-a)*data[i],G=a*32+(1-a)*data[i+1],B=a*42+(1-a)*data[i+2];
      const cr=1.05/(lum(R,G,B)+0.05);
      if(cr<worst){worst=cr;at=[px,py,Math.round(R),Math.round(G),Math.round(B),+a.toFixed(2)];}
    }
    log('  '+lab+' fs='+getComputedStyle(el).fontSize+' rect='+[X0,Y0,X1-X0,Y1-Y0]+' NEJHORSI='+worst.toFixed(2)+':1 pixel='+JSON.stringify(at));
  });
  f.remove();
}
(async()=>{for(const w of [360,768,1280,1440]){try{await mer(w)}catch(e){log(w+' ERR '+e.message)}}log('KONEC');document.title='K2HOTOVO';})();
</script></body></html>
