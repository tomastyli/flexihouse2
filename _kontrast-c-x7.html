<!DOCTYPE html><html><head><meta charset="utf-8"><title>kontrastC-x7</title></head><body>
<pre id="out">cekam</pre>
<script>
function lum(r,g,b){const f=v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)};return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b)}
async function mer(w){
  const f=document.createElement('iframe');
  f.style.cssText='position:fixed;left:0;top:0;z-index:9;border:0;width:'+w+'px;height:900px;opacity:.01';
  f.src='/_navrh-C.html';
  document.body.appendChild(f);
  await new Promise(x=>{f.onload=x;setTimeout(x,6000)});
  const d=f.contentDocument;
  const band=d.querySelector('.kl-band');
  band.scrollIntoView();
  await new Promise(x=>setTimeout(x,2000));
  const img=d.querySelector('.kl-band__foto');
  img.loading='eager';
  try{await img.decode()}catch(e){}
  await new Promise(x=>setTimeout(x,1200));
  if(!img.complete||!img.naturalWidth){f.remove();return w+': foto se nenacetlo';}
  const bandR=band.getBoundingClientRect();
  const BW=bandR.width,BH=bandR.height;
  const nw=img.naturalWidth,nh=img.naturalHeight;
  const sc=Math.max(BW/nw,BH/nh),dw=nw*sc,dh=nh*sc,ox=(BW-dw)/2,oy=(BH-dh)/2;
  const c=document.createElement('canvas');c.width=Math.round(BW);c.height=Math.round(BH);
  const ctx=c.getContext('2d');ctx.drawImage(img,ox,oy,dw,dh);
  const data=ctx.getImageData(0,0,c.width,c.height).data;
  const A=96*Math.PI/180,sx=Math.sin(A),cy=Math.cos(A);
  const L=Math.abs(BW*sx)+Math.abs(BH*cy);
  const x0=BW/2-(L/2)*sx,y0=BH/2+(L/2)*cy;
  const tAt=(x,y)=>((x-x0)*sx+(y-y0)*(-cy))/L;
  const aAt=t=>t<=0.38?0.93:(t>=1?0.5:(t<=0.62?0.93+(0.74-0.93)*(t-0.38)/0.24:0.74+(0.5-0.74)*(t-0.62)/0.38));
  function samp(sel,lab){
    const el=d.querySelector(sel); if(!el) return lab+': chybi';
    const r=el.getBoundingClientRect();
    let worst=99,at=null;
    for(let px=Math.max(0,Math.round(r.left-bandR.left));px<Math.min(c.width,Math.round(r.right-bandR.left));px+=2)
    for(let py=Math.max(0,Math.round(r.top-bandR.top));py<Math.min(c.height,Math.round(r.bottom-bandR.top));py+=2){
      const i=(py*c.width+px)*4,a=aAt(tAt(px,py));
      const R=a*22+(1-a)*data[i],G=a*32+(1-a)*data[i+1],B=a*42+(1-a)*data[i+2];
      const cr=1.05/(lum(R,G,B)+0.05);
      if(cr<worst){worst=cr;at=[px,py,Math.round(R),Math.round(G),Math.round(B),a.toFixed(2)];}
    }
    return lab+' fs='+getComputedStyle(el).fontSize+' rect='+[Math.round(r.left-bandR.left),Math.round(r.top-bandR.top),Math.round(r.width),Math.round(r.height)].join(',')+' nejhorsi='+worst.toFixed(2)+':1 @'+JSON.stringify(at);
  }
  const o=w+'px  band '+Math.round(BW)+'x'+Math.round(BH)+'\n  '+samp('.kl-band h2','h2')+'\n  '+samp('.kl-band p','p')+'\n  '+samp('.kl-kota--b span','kota');
  f.remove();return o;
}
(async()=>{const r=[];for(const w of [360,414,768,900,1280,1440]){try{r.push(await mer(w))}catch(e){r.push(w+' ERR '+e.message)}}
document.getElementById('out').textContent=r.join('\n');document.title='HOTOVO2-x7';})();
</script></body></html>
